# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=collectible-items-management-system

# ==============================================================
# Database Configuration
# Default: H2 In-Memory DB (Works out of the box with zero setup)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:collectibles_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================
# To switch to MySQL, uncomment the lines below and adjust password:
# ==============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/collectibles_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.raretrack=INFO
